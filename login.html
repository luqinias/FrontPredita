<!DOCTYPE html>
<html>
<head>
  <title>Predita</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body background="assets/images/background.jpg">
  <div class="wrapper fadeInDown">
    <div id="formContent">
      <div class="fadeIn first">
        <img src="assets/images/logo.jpg" id="icon" alt="User Icon" />
      </div>

      <form id="loginForm">
        <input type="text" id="username" class="fadeIn second" placeholder="Email" required>
        <input type="password" id="password" class="fadeIn third" placeholder="Senha" required>
        <input type="submit" class="fadeIn fourth" value="Entrar">
      </form>

      <div id="formFooter">
        <a class="underlineHover" href="#">Esqueceu a Senha?</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();
      const email = document.getElementById("username").value;
      const senha = document.getElementById("password").value;
      const response = await fetch("https://backpredita.onrender.com/api/login",      
       {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, senha })
      }
    );

      if (response.ok) {
        window.location.href = "index.html";
      } else {
        alert("Credenciais inválidas, tente novamente.");
      }
    });
  </script>
</body>
</html>
